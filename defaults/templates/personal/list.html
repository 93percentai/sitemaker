<!DOCTYPE html>
<html lang="{{ .Site.Language }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Page.Title }} - {{ .Site.Title }}</title>
    <meta name="description" content="{{ .Site.Description }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: { extend: { colors: { accent: '#2563eb' } } }
    }
    </script>
    <link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="/rss.xml">
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col">
    {{ template "header" . }}

    <div class="flex-1 w-full max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <h1 class="text-3xl font-bold mb-8">{{ .Page.Title }}</h1>

        {{ if .Posts }}
        <div class="space-y-8">
            {{ range .Posts }}
            <article class="group">
                <div class="flex flex-col sm:flex-row sm:items-baseline gap-1 sm:gap-4">
                    {{ if .DateStr }}
                    <time datetime="{{ .DateStr }}" class="text-sm text-gray-400 font-mono shrink-0">{{ .DateStr }}</time>
                    {{ end }}
                    <div>
                        <h2 class="text-lg font-semibold">
                            <a href="{{ .URL }}" class="text-gray-900 hover:text-accent transition-colors">{{ .Title }}</a>
                        </h2>
                        {{ if .Tags }}
                        <div class="flex gap-2 mt-1">
                            {{ range .Tags }}
                            <span class="text-xs text-gray-400">#{{ . }}</span>
                            {{ end }}
                        </div>
                        {{ end }}
                    </div>
                </div>
            </article>
            {{ end }}
        </div>
        {{ else }}
        <p class="text-gray-500">No posts yet.</p>
        {{ end }}
    </div>

    {{ template "footer" . }}
</body>
</html>
