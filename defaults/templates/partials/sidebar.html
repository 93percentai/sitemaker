{{ define "sidebar" }}
<nav class="sticky top-8">
    <h3 class="text-sm font-semibold text-gray-900 uppercase tracking-wider mb-4">Navigation</h3>
    <ul class="space-y-2">
        {{ range .Site.Nav }}
        <li>
            <a href="{{ .URL }}" class="text-sm text-gray-600 hover:text-accent transition-colors">{{ .Label }}</a>
        </li>
        {{ end }}
    </ul>
</nav>
{{ end }}
