{{ define "footer" }}
<footer class="border-t border-gray-200 bg-white mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 text-sm text-gray-500">
            <p>&copy; {{ now.Year }} {{ .Site.Author }}. Built with <a href="https://github.com/93percentai/sitemaker" class="text-accent hover:underline">sitemaker</a>.</p>
            <div class="flex gap-4">
                {{ range .Site.Nav }}
                <a href="{{ .URL }}" class="hover:text-accent transition-colors">{{ .Label }}</a>
                {{ end }}
                <a href="/rss.xml" class="hover:text-accent transition-colors">RSS</a>
            </div>
        </div>
    </div>
</footer>
{{ end }}
