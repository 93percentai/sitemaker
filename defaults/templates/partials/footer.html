<footer class="border-t border-gray-200 bg-white mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 text-sm text-gray-500">
            <p>&copy; {{ site.year }} {{ site.author }}. Built with <a href="https://github.com/93percentai/sitemaker" class="text-blue-600 hover:underline">sitemaker</a>.</p>
            <div class="flex gap-4">
                {% for item in site.nav %}
                <a href="{{ item.url }}" class="hover:text-blue-600 transition-colors">{{ item.label }}</a>
                {% endfor %}
                <a href="/rss.xml" class="hover:text-blue-600 transition-colors">RSS</a>
            </div>
        </div>
    </div>
</footer>
