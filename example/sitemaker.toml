[site]
title = "Sitemaker Examples"
description = "Example blog generated by Claude to demonstrate sitemaker features."
base_url = "/"
author = "Claude (Example Content)"
language = "en"

[[site.nav]]
label = "Home"
url = "/"

[[site.nav]]
label = "Posts"
url = "/posts/"

[[site.nav]]
label = "About"
url = "/about.html"

[build]
content_dir = "content"
template_dir = "templates"
static_dir = "static"
output_dir = "dist"

[blog]
posts_dir = "posts"
date_format = "2006-01-02"
posts_per_page = 10
enable_rss = true

[urls]
style = "flat"
strip_date = true

template = "personal"
