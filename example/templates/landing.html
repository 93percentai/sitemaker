<!DOCTYPE html>
<html lang="{{ site.language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} - {{ site.title }}</title>
  <link rel="stylesheet" href="/assets/css/tailwind.css">
</head>
<body style="margin: 0; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; color: white; font-family: system-ui, sans-serif;">
  <div style="max-width: 48rem; margin: 0 auto; padding: 4rem 2rem; text-align: center;">
    <h1 style="font-size: 3rem; font-weight: 800; margin: 0 0 1rem 0; background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">{{ site.title }}</h1>
    <p style="font-size: 1.25rem; color: #94a3b8; margin: 0 0 3rem 0;">{{ site.description }}</p>
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
      <a href="/posts/" style="padding: 0.75rem 2rem; background: #2563eb; color: white; text-decoration: none; border-radius: 0.5rem; font-weight: 600;">Read the Blog</a>
      <a href="/about.html" style="padding: 0.75rem 2rem; background: transparent; color: #93c5fd; text-decoration: none; border-radius: 0.5rem; border: 1px solid #334155; font-weight: 600;">About Me</a>
    </div>
  </div>
  <div style="max-width: 48rem; margin: 0 auto; padding: 0 2rem 4rem;">
    <div style="color: #cbd5e1;">
      {{ page.htmlContent }}
    </div>
  </div>
</body>
</html>
